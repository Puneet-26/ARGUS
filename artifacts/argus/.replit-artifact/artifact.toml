kind = "web"
previewPath = "/"
title = "ARGUS"
description = "An interactive computer-vision workshop where participants investigate image evidence through real OpenCV processing and record their findings."
version = "1.0.0"
id = "artifacts/argus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25063

[services.development]
run = "pnpm --filter @workspace/argus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/argus", "run", "build" ]
serve = "static"
publicDir = "artifacts/argus/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25063"
BASE_PATH = "/"
